<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Fashion Store</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&family=Abril+Fatface&family=Inter:wght@100..900&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, sans-serif;
            overflow-x: hidden;
            background: #fff;
        }

        .container {
            width: 90%;
            max-width: 1400px;
            margin: auto;
        }
    </style>
</head>

<body>
    <section>
        <div class="min-h-screen bg-[#F5F1EA] flex items-center justify-center p-6">
            <div class="w-full max-w-4xl bg-white rounded-[28px] border border-[#E6DCC8] shadow-lg p-5">

                <!-- Header -->
                <div class="flex items-start justify-between">
                    <div>
                        <div class="flex items-center gap-1 text-[10px] uppercase tracking-wider text-gray-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M18 8l-6 6-6-6" />
                            </svg>
                            Tailored For You
                        </div>

                        <h2 class="text-[22px] font-semibold mt-1">
                            Custom Size Studio
                        </h2>
                    </div>

                    <button class="w-8 h-8 rounded-lg bg-gray-100 text-gray-500 flex items-center justify-center">
                        ✕
                    </button>
                </div>

                <!-- Stepper -->
                <div class="flex items-center justify-between mt-8">

                    <div class="flex items-center gap-2">
                        <span class="w-5 h-5 rounded-full bg-gray-200 text-[10px] flex items-center justify-center">
                            1
                        </span>
                        <span class="text-[#B88412] font-medium">
                            Pose Photos
                        </span>
                    </div>

                    <div class="flex-1 h-px bg-gray-300 mx-5"></div>

                    <div class="flex items-center gap-2">
                        <span class="w-5 h-5 rounded-full bg-gray-200 text-[10px] flex items-center justify-center">
                            2
                        </span>
                        <span class="text-[#B88412] font-medium">
                            Measurements
                        </span>
                    </div>

                    <div class="flex-1 h-px bg-gray-300 mx-5"></div>

                    <div class="flex items-center gap-2 bg-[#E5C98B] px-4 py-2 rounded-lg text-[#8E6610] font-medium">
                        <span
                            class="w-5 h-5 rounded-full bg-[#C79B34] text-white text-[10px] flex items-center justify-center">
                            3
                        </span>
                        Fitting & type
                    </div>

                </div>

                <div class="border-t border-gray-200 mt-4 pt-4">

                    <!-- Fitting Type -->
                    <div>
                        <h3 class="text-[18px] font-semibold border-l-2 border-[#C79B34] pl-2 mb-3">
                            Fitting type
                        </h3>

                        <div class="grid grid-cols-3 gap-4">

                            <button class="h-14 rounded-2xl bg-[#FEF6E8] text-[#D2AF68] text-sm">
                                Slim
                            </button>

                            <button
                                class="relative h-14 rounded-2xl border border-[#D1A74E] bg-[#feeabf] text-[#9B7316] text-sm">
                                Regular

                                <span
                                    class="absolute top-2 right-2 w-5 h-5 rounded-full bg-[#D1A74E] text-white text-[10px] flex items-center justify-center">
                                    ✓
                                </span>
                            </button>

                            <button class="h-14 rounded-2xl bg-[#FEF6E8] text-[#D2AF68] text-sm">
                                loose
                            </button>

                        </div>
                    </div>

                    <!-- Shoulder Type -->
                    <div class="mt-5">

                        <h3 class="text-[18px] font-semibold border-l-2 border-[#C79B34] pl-2 mb-3">
                            Shoulder type
                        </h3>

                        <div class="grid grid-cols-3 gap-4">

                            <!-- Card -->
                            <div class="bg-[#FEF6E8] rounded-3xl p-4 flex flex-col items-center">
                                <img src="images/squareShoulder.png" alt="Square Shoulder" class="h-20 object-contain">
                                <span class="text-xs text-[#D2AF68] mt-2">
                                    Square Shoulder
                                </span>
                            </div>

                            <!-- Active -->
                            <div
                                class="relative bg-[#feeabf] border border-[#D1A74E] rounded-3xl p-4 flex flex-col items-center">

                                <span
                                    class="absolute top-3 right-3 w-5 h-5 rounded-full bg-[#D1A74E] text-white text-[10px] flex items-center justify-center">
                                    ✓
                                </span>

                                <img src="images/normalShoulder.png" alt="Normal Shoulder" class="h-20 object-contain">

                                <span class="text-xs text-[#9B7316] mt-2">
                                    Normal Shoulder
                                </span>
                            </div>

                            <div class="bg-[#FEF6E8] rounded-3xl p-4 flex flex-col items-center">
                                <img src="images/downShoulder.png" alt="Down Shoulder" class="h-20 object-contain">

                                <span class="text-xs text-[#D2AF68] mt-2">
                                    Down Shoulder
                                </span>
                            </div>

                        </div>

                    </div>

                    <!-- Body Type -->
                    <div class="mt-5">

                        <h3 class="text-[18px] font-semibold border-l-2 border-[#C79B34] pl-2 mb-3">
                            Body type
                        </h3>

                        <div class="grid grid-cols-4 gap-4">

                            <div class="bg-[#FEF6E8] rounded-3xl p-4 flex flex-col items-center">
                                <img src="images/muscular-body.png" alt="" class="h-20 object-contain">
                                <span class="text-xs text-[#D2AF68] mt-2">
                                    Muscular body
                                </span>
                            </div>

                            <div
                                class="relative bg-[#feeabf] border border-[#D1A74E] rounded-3xl p-4 flex flex-col items-center">

                                <span
                                    class="absolute top-3 right-3 w-5 h-5 rounded-full bg-[#D1A74E] text-white text-[10px] flex items-center justify-center">
                                    ✓
                                </span>

                                <img src="images/triangle-body.png" alt="" class="h-20 object-contain">

                                <span class="text-xs text-[#9B7316] mt-2">
                                    Triangle Body
                                </span>
                            </div>

                            <div class="bg-[#FEF6E8] rounded-3xl p-4 flex flex-col items-center">
                                <img src="images/rectangular-body.png" alt="" class="h-20 object-contain">
                                <span class="text-xs text-[#D2AF68] mt-2">
                                    Rectangular Body
                                </span>
                            </div>

                            <div class="bg-[#FEF6E8] rounded-3xl p-4 flex flex-col items-center">
                                <img src="images/oval-body.png" alt="" class="h-20 object-contain">
                                <span class="text-xs text-[#D2AF68] mt-2">
                                    Oval Body
                                </span>
                            </div>

                        </div>

                    </div>

                </div>

                <!-- Footer -->
                <div class="flex items-center justify-between mt-4">

                    <button class="px-5 py-2 bg-gray-100 text-gray-400 rounded-lg text-sm flex items-center gap-2">
                        ← Back
                    </button>

                    <!-- Progress -->
                    <div class="flex items-center gap-1">
                        <div class="w-8 h-2 rounded-full bg-[#C79B34]"></div>
                        <div class="w-2 h-2 rounded-full bg-[#E5C98B]"></div>
                        <div class="w-2 h-2 rounded-full bg-[#E5C98B]"></div>
                        <div class="w-2 h-2 rounded-full bg-[#E5C98B]"></div>
                    </div>

                    <button
                        class="px-6 py-2 bg-[#D4B06A] text-black rounded-lg text-sm font-medium flex items-center gap-2">
                        Save & Add to Cart

                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>

                </div>

            </div>
        </div>
    </section>
</body>

</html>
