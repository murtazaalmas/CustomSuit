<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Abril Fatface Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">
</head>

<body class="overflow-hidden">

    <!-- Background Section -->
    <div class="relative h-screen w-full">

        <!-- Background Image -->
        <img src="images/login-bg.png" alt="Background"
            class="absolute inset-0 w-full h-full object-cover">

        <!-- Dark Overlay -->
        <div class="absolute inset-0 bg-black/50"></div>

        <!-- Top Bar -->
        <div class="absolute top-0 left-0 right-0 z-30 text-[#C0A96E] text-center text-sm py-2 tracking-wider"
            style="background: linear-gradient(90deg, #221E1B 0%, #3C2B1E 50%, #211E1B 100%);">
            FREE SHIPPING ON ORDERS ABOVE Rs. 10,000 | CUSTOM TAILORING AVAILABLE
        </div>

        <!-- Header -->
        <header class="absolute top-9 left-0 right-0 z-30 px-6 md:px-10 bg-[#D9D9D9] bg-opacity-20">

            <div class="grid grid-cols-3 items-center px-10">

                <!-- Menu -->
                <div>
                    <button id="menuBtn" class="text-white text-2xl">
                        <i class="fa-solid fa-bars-staggered"></i>
                    </button>
                </div>

                <!-- Logo -->
                <div class="flex justify-center">
                    <img src="images/logo.png" alt="Logo" class="h-20 md:h-24 w-auto">
                </div>

                <!-- Right Icons -->
                <div class="flex justify-end items-center gap-5 text-white text-lg">
                    <button>
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>

                    <button>
                        <i class="fa-regular fa-heart"></i>
                    </button>

                    <button>
                        <i class="fa-solid fa-bag-shopping"></i>
                    </button>

                    <button>
                        <i class="fa-regular fa-user"></i>
                    </button>
                </div>

            </div>

        </header>

        <!-- Login Box -->
        <div class="relative z-20 flex items-start justify-center min-h-screen pt-[12%] px-4">

            <div class="w-full max-w-md bg-white/95 backdrop-blur-sm rounded-3xl p-6 md:p-8 shadow-2xl">

                <div class="text-center mb-6">
                    <h1 class="text-3xl font-bold tracking-widest">WELCOME</h1>
                    <p class="text-gray-500 text-sm mt-2">Sign in to your account</p>
                </div>

                <form class="space-y-4">

                    <!-- Email -->
                    <div class="relative">
                        <input type="email" placeholder="Enter Email"
                            class="w-full h-12 rounded-lg bg-gray-100 px-4 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-black">

                        <i class="fa-regular fa-envelope absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    </div>

                    <!-- Password -->
                    <div class="relative">
                        <input id="passwordInput" type="password" placeholder="Enter Password"
                            class="w-full h-12 rounded-lg bg-gray-100 px-4 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-black">

                        <i id="togglePassword"
                            class="fa-regular fa-eye-slash absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer"></i>
                    </div>

                    <div class="flex justify-end">
                        <a href="#" class="text-xs text-gray-500 hover:text-black">
                            Recover Password?
                        </a>
                    </div>

                    <button type="submit"
                        class="w-full h-12 bg-black text-white rounded-lg font-medium hover:bg-gray-800">
                        Sign In
                    </button>

                </form>
                <!-- Divider -->
                <div class="flex items-center my-4">
                    <div class="flex-1 border-t border-gray-200"></div>

                    <span class="px-4 text-sm text-gray-400">
                        Or continue with
                    </span>

                    <div class="flex-1 border-t border-gray-200"></div>
                </div>

                <!-- Social Login -->
                <div class="grid grid-cols-3 gap-3">

                    <button class="h-12 border rounded-lg flex items-center justify-center hover:bg-gray-50 transition">
                        <i class="fa-brands fa-google text-red-500 text-lg"></i>
                    </button>

                    <button class="h-12 border rounded-lg flex items-center justify-center hover:bg-gray-50 transition">
                        <i class="fa-brands fa-apple text-black text-xl"></i>
                    </button>

                    <button class="h-12 border rounded-lg flex items-center justify-center hover:bg-gray-50 transition">
                        <i class="fa-brands fa-facebook-f text-blue-600 text-lg"></i>
                    </button>

                </div>

                <!-- Signup -->
                <div class="text-center mt-6 text-sm text-gray-500">
                    Don't have an account?
                    <a href="#" class="font-semibold text-black hover:underline">
                        Sign Up
                    </a>
                </div>

            </div>

        </div>

        <!-- Bottom center text -->
        <div class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-10 w-full max-w-3xl px-4">
            <p class="text-white text-center mx-auto" style="font-family: 'Abril Fatface', serif; font-weight:400; font-size:50px; line-height:110%; letter-spacing:0;">Elevate Your Style</p>
        </div>
    </div>

    <!-- Sidebar Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 hidden z-40"></div>

    <!-- Sidebar -->
    <div id="sidebar" class="fixed top-0 left-0 h-screen w-[320px] bg-white z-50 shadow-2xl transition-all duration-300"
        style="transform: translateX(-100%);">

        <div class="flex justify-between items-center p-5 border-b">
            <h2 class="text-xl font-semibold">Menu</h2>
            <button id="closeSidebar">
                <i class="fa-solid fa-xmark text-2xl"></i>
            </button>
        </div>

        <div class="p-5">
            <ul class="space-y-5 text-lg">
                <li><a href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
    </div>

    <!-- JS -->
    <script>
        // Sidebar
        const menuBtn = document.getElementById("menuBtn");
        const sidebar = document.getElementById("sidebar");
        const sidebarOverlay = document.getElementById("sidebarOverlay");
        const closeSidebar = document.getElementById("closeSidebar");

        menuBtn.addEventListener("click", () => {
            sidebar.style.transform = "translateX(0)";
            sidebarOverlay.classList.remove("hidden");
        });

        function closeMenu() {
            sidebar.style.transform = "translateX(-100%)";
            sidebarOverlay.classList.add("hidden");
        }

        closeSidebar.addEventListener("click", closeMenu);
        sidebarOverlay.addEventListener("click", closeMenu);

        // Password toggle
        const passwordInput = document.getElementById("passwordInput");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", () => {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";

            togglePassword.classList.toggle("fa-eye");
            togglePassword.classList.toggle("fa-eye-slash");
        });
    </script>

</body>

</html>
