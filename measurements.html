<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Fashion Store</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&family=Abril+Fatface&family=Inter:wght@100..900&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, sans-serif;
            overflow-x: hidden;
            background: #fff;
        }

        .container {
            width: 90%;
            max-width: 1400px;
            margin: auto;
        }
    </style>
</head>

<body>
    <section>
        <div class="min-h-screen bg-[#F5F1EA] flex items-center justify-center p-6">
            <div class="w-full max-w-4xl bg-white rounded-[24px] border border-[#E8DFC9] shadow-lg p-6">

                <!-- Header -->
                <div class="flex items-start justify-between">
                    <div>
                        <div class="flex items-center gap-1 text-[10px] uppercase text-gray-500 tracking-wider">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M18 8l-6 6-6-6" />
                            </svg>
                            Tailored For You
                        </div>

                        <h2 class="text-[34px] font-semibold leading-tight mt-1">
                            Custom Size Studio
                        </h2>
                    </div>

                    <button class="w-8 h-8 rounded-lg bg-gray-100 text-gray-500 flex items-center justify-center">
                        ✕
                    </button>
                </div>

                <!-- Stepper -->
                <div class="flex items-center justify-between mt-10">

                    <!-- Step 1 -->
                    <div class="flex items-center gap-2">
                        <span
                            class="w-5 h-5 rounded-full bg-gray-200 text-[10px] flex items-center justify-center text-gray-600">
                            1
                        </span>
                        <span class="text-[#C88D17] font-medium">
                            Pose Photos
                        </span>
                    </div>

                    <div class="flex-1 h-px bg-gray-300 mx-6"></div>

                    <!-- Step 2 -->
                    <div class="flex items-center gap-2 bg-[#E7C98A] text-[#9A6A10] px-4 py-2 rounded-lg font-medium">
                        <span
                            class="w-5 h-5 rounded-full bg-[#C88D17] text-white text-[10px] flex items-center justify-center">
                            2
                        </span>
                        Measurements
                    </div>

                    <div class="flex-1 h-px bg-gray-300 mx-6"></div>

                    <!-- Step 3 -->
                    <div class="flex items-center gap-2">
                        <span
                            class="w-5 h-5 rounded-full bg-gray-200 text-[10px] flex items-center justify-center text-gray-600">
                            3
                        </span>
                        <span>Fitting & type</span>
                    </div>

                </div>

                <div class="border-t mt-6 pt-6">
                    <p class="text-gray-500 text-sm">
                        Enter all measurements in inches or cm. Be precise for the best fit.
                    </p>
                </div>

                <!-- Form -->
                <form class="mt-6">

                    <div class="grid grid-cols-3 gap-x-4 gap-y-4">

                        <div>
                            <label class="block text-[11px] text-gray-500 mb-1">
                                Profile Name
                            </label>
                            <input type="text"
                                class="w-full h-12 rounded-xl border border-[#D8B15A] bg-[#F7F0DF] px-4 outline-none focus:ring-1 focus:ring-[#D8B15A]">
                        </div>

                        <div>
                            <label class="block text-[11px] text-gray-500 mb-1">
                                Shoulder Width
                            </label>
                            <input type="text" class="w-full h-12 rounded-xl border border-[#D8B15A] bg-[#F7F0DF] px-4">
                        </div>

                        <div>
                            <label class="block text-[11px] text-gray-500 mb-1">
                                Sleeves Length
                            </label>
                            <input type="text" class="w-full h-12 rounded-xl border border-[#D8B15A] bg-[#F7F0DF] px-4">
                        </div>

                        <div>
                            <label class="block text-[11px] text-gray-500 mb-1">
                                Bicep *
                            </label>
                            <input type="text" class="w-full h-12 rounded-xl border border-[#D8B15A] bg-[#F7F0DF] px-4">
                        </div>

                        <div>
                            <label class="block text-[11px] text-gray-500 mb-1">
                                Wrist *
                            </label>
                            <input type="text" class="w-full h-12 rounded-xl border border-[#D8B15A] bg-[#F7F0DF] px-4">
                        </div>

                        <div>
                            <label class="block text-[11px] text-gray-500 mb-1">
                                Neck *
                            </label>
                            <input type="text" class="w-full h-12 rounded-xl border border-[#D8B15A] bg-[#F7F0DF] px-4">
                        </div>

                        <div>
                            <label class="block text-[11px] text-gray-500 mb-1">
                                Chest *
                            </label>
                            <input type="text" class="w-full h-12 rounded-xl border border-[#D8B15A] bg-[#F7F0DF] px-4">
                        </div>

                        <div>
                            <label class="block text-[11px] text-gray-500 mb-1">
                                Waist / Belly *
                            </label>
                            <input type="text" class="w-full h-12 rounded-xl border border-[#D8B15A] bg-[#F7F0DF] px-4">
                        </div>

                        <div>
                            <label class="block text-[11px] text-gray-500 mb-1">
                                Hip *
                            </label>
                            <input type="text" class="w-full h-12 rounded-xl border border-[#D8B15A] bg-[#F7F0DF] px-4">
                        </div>

                        <div>
                            <label class="block text-[11px] text-gray-500 mb-1">
                                Kurta Length *
                            </label>
                            <input type="text" class="w-full h-12 rounded-xl border border-[#D8B15A] bg-[#F7F0DF] px-4">
                        </div>

                        <div>
                            <label class="block text-[11px] text-gray-500 mb-1">
                                Shalwar (Trouser) Length *
                            </label>
                            <input type="text" class="w-full h-12 rounded-xl border border-[#D8B15A] bg-[#F7F0DF] px-4">
                        </div>

                        <div>
                            <label class="block text-[11px] text-gray-500 mb-1">
                                Trouser Waist *
                            </label>
                            <input type="text" class="w-full h-12 rounded-xl border border-[#D8B15A] bg-[#F7F0DF] px-4">
                        </div>

                        <div>
                            <label class="block text-[11px] text-gray-500 mb-1">
                                Thigh *
                            </label>
                            <input type="text" class="w-full h-12 rounded-xl border border-[#D8B15A] bg-[#F7F0DF] px-4">
                        </div>

                        <div>
                            <label class="block text-[11px] text-gray-500 mb-1">
                                Calf *
                            </label>
                            <input type="text" class="w-full h-12 rounded-xl border border-[#D8B15A] bg-[#F7F0DF] px-4">
                        </div>

                        <div>
                            <label class="block text-[11px] text-gray-500 mb-1">
                                Trouser Bottom Width
                            </label>
                            <input type="text" class="w-full h-12 rounded-xl border border-[#D8B15A] bg-[#F7F0DF] px-4">
                        </div>

                    </div>

                    <!-- Instructions -->
                    <div class="mt-4">
                        <label class="block text-[11px] text-gray-500 mb-1">
                            Special Instructions
                        </label>

                        <textarea rows="2"
                            class="w-full rounded-xl border border-[#D8B15A] bg-[#F7F0DF] px-4 py-3 resize-none outline-none"></textarea>
                    </div>

                </form>

                <!-- Footer -->
                <div class="flex items-center justify-between mt-6">

                    <button class="px-5 py-2 bg-gray-100 text-gray-400 rounded-lg text-sm flex items-center gap-2">
                        ← Back
                    </button>

                    <div class="flex items-center gap-1">
                        <div class="w-8 h-2 rounded-full bg-[#C88D17]"></div>
                        <div class="w-2 h-2 rounded-full bg-[#E7C98A]"></div>
                        <div class="w-2 h-2 rounded-full bg-[#E7C98A]"></div>
                        <div class="w-2 h-2 rounded-full bg-[#E7C98A]"></div>
                    </div>

                    <button
                        class="px-6 py-2 bg-[#D8B15A] hover:bg-[#C89A39] rounded-lg text-sm font-medium flex items-center gap-2">
                        Next
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>

                </div>

            </div>
        </div>
    </section>
</body>

</html>
