<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Region</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="overflow-hidden">

    <!-- Background Section -->
    <div class="relative h-screen w-full">

        <!-- Background Image -->
        <img src="images/region-bg.png" alt="" class="absolute inset-0 w-full h-full object-cover">

        <!-- Right Side Wrapper (Logo + Card) -->
        <div class="absolute right-10 top-1/2 -translate-y-1/2 flex flex-col items-center gap-4">

            <!-- Logo ABOVE card -->
            <img src="images/logo.png" alt="Logo" class="h-28 md:h-32 w-auto">

            <!-- Country Selector Card (WIDER) -->
            <div class="bg-white rounded-2xl shadow-xl p-5 w-96">

                <h3 class="text-sm font-medium text-gray-700 mb-3 text-center">
                    Select Your Country
                </h3>
                <!-- Line Bar -->
                <div class="flex justify-center ">
                    <div class="w-[80%] h-0.5 bg-gray-300 rounded-full"></div>
                </div>

                <ul class="space-y-3 mt-2">

                    <li class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 p-2 rounded">
                        <img src="https://flagcdn.com/w40/pk.png" class="w-5 h-4">
                        <span class="text-sm">Pakistan</span>
                    </li>

                    <li class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 p-2 rounded">
                        <img src="https://flagcdn.com/w40/gb.png" class="w-5 h-4">
                        <span class="text-sm">United Kingdom</span>
                    </li>

                    <li class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 p-2 rounded">
                        <img src="https://flagcdn.com/w40/us.png" class="w-5 h-4">
                        <span class="text-sm">United States</span>
                    </li>

                    <li class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 p-2 rounded">
                        <img src="https://flagcdn.com/w40/ae.png" class="w-5 h-4">
                        <span class="text-sm">United Arab Emirates</span>
                    </li>

                    <li class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 p-2 rounded">
                        <div
                            class="w-5 h-5 rounded-full bg-blue-500 flex items-center justify-center text-white text-xs">
                            🌐
                        </div>
                        <span class="text-sm">Global</span>
                    </li>

                </ul>

            </div>

        </div>

    </div>

</body>

</html>
