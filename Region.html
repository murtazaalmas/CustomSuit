<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Region</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&family=Abril+Fatface&family=Inter:wght@100..900&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body class="overflow-hidden">
    <!-- Background Section -->
    <section>
      <div class="relative min-h-screen w-full">
        <!-- Background Image -->
        <img
          src="images/region-bg.png"
          alt=""
          class="absolute inset-0 w-full h-full object-cover"
        />

        <!-- Content Wrapper -->
        <div
          class="absolute inset-0 flex items-center justify-center px-4 lg:justify-end lg:pr-10"
        >
          <!-- Logo + Card -->
          <div class="flex flex-col items-center gap-4 w-full max-w-md">
            <!-- Logo -->
            <img
              src="images/logo.png"
              alt="Logo"
              class="h-24 sm:h-28 md:h-32 lg:h-40 w-auto"
            />

            <!-- Country Selector Card -->
            <div
              class="w-full rounded-2xl shadow-xl p-4 sm:p-6 bg-white/50 backdrop-blur-lg border border-white/40"
            >
              <h3 class="text-lg font-medium text-black mb-4 text-center">
                Select Your Country
              </h3>

              <!-- Divider -->
              <div class="flex justify-center">
                <div class="w-full h-0.5 bg-[#ACADAC] rounded-full"></div>
              </div>

              <ul class="space-y-3 sm:space-y-4 mt-4">
                <li
                  class="flex items-center gap-4 cursor-pointer hover:bg-white/30 py-2 px-4 rounded-lg transition"
                >
                  <img src="https://flagcdn.com/w40/pk.png" class="w-5 h-4" />
                  <span class="text-sm sm:text-base">Pakistan</span>
                </li>

                <li
                  class="flex items-center gap-4 cursor-pointer hover:bg-white/30 py-2 px-4 rounded-lg transition"
                >
                  <img src="https://flagcdn.com/w40/gb.png" class="w-5 h-4" />
                  <span class="text-sm sm:text-base">United Kingdom</span>
                </li>

                <li
                  class="flex items-center gap-4 cursor-pointer hover:bg-white/30 py-2 px-4 rounded-lg transition"
                >
                  <img src="https://flagcdn.com/w40/us.png" class="w-5 h-4" />
                  <span class="text-sm sm:text-base">United States</span>
                </li>

                <li
                  class="flex items-center gap-4 cursor-pointer hover:bg-white/30 py-2 px-4 rounded-lg transition"
                >
                  <img src="https://flagcdn.com/w40/ae.png" class="w-5 h-4" />
                  <span class="text-sm sm:text-base">United Arab Emirates</span>
                </li>

                <li
                  class="flex items-center gap-4 cursor-pointer hover:bg-white/30 py-2 px-4 rounded-lg transition"
                >
                  <div
                    class="w-5 h-5 rounded-full bg-blue-500 flex items-center justify-center text-white text-xs"
                  >
                    🌐
                  </div>
                  <span class="text-sm sm:text-base">Global</span>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
